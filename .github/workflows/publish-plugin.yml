name: publish-plugin

on:
  workflow_dispatch:

jobs:
  publish-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - name: Auto-bump patch version and persist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          NEW_VER=$(node -p "require('./package.json').version")
          sed -i "s/version: '.*'/version: '$NEW_VER'/" src/pluginConfig.ts
          echo "Automated build version set to: $NEW_VER"
          git add package.json package-lock.json src/pluginConfig.ts
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(release): bump version to $NEW_VER" && git push)

      - name: Build
        run: |
          npm ci
          npm run build
      - name: Publish Plugin
        run: |
          if [ -z "$WINDY_API_KEY" ]; then
            echo "Secret WINDY_API_KEY is not configured" >&2
            exit 1
          fi
          cd dist
          echo "Creating plugin archive..."
          echo "{\"repositoryName\": \"${{ github.repository }}\", \"commitSha\": \"${{ github.sha }}\", \"repositoryOwner\": \"${{ github.repository_owner }}\"}" > /tmp/plugin-info.json
          mv plugin.json /tmp
          jq -s '.[0] * .[1]' /tmp/plugin.json /tmp/plugin-info.json > plugin.json
          tar cf ../plugin.tar .
          echo "Publishing plugin..."
          curl -s --fail-with-body -XPOST 'https://node.windy.com/plugins/v1.0/upload' -H "x-windy-api-key: ${WINDY_API_KEY}" -F "plugin_archive=@../plugin.tar"